name: build-ios

# 产出未签名的 iOS .app / IPA（--no-codesign）。
# 若需要上架，请在本仓库配置 secrets 后改用 exportOptions.plist + 证书导入步骤。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS (no codesign)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # 锁定版本：避免 stable 浮动升级导致三方插件（pdfrx/file_picker 等）兼容性断裂
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Scaffold native projects
        # 平台目录由 sync-generated.yml 提交到仓库；缺失时兜底脚手架
        run: |
          set -e
          if [ ! -d ios ]; then
            flutter create --project-name moread --org com.moread \
              --platforms=ios /tmp/scaffold
            cp -r /tmp/scaffold/ios .
          else
            echo "ios/ already committed, skip scaffolding"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      # 说明：CI 没有开发团队证书，`flutter build ipa` / `flutter build ios --release`
      # 都会在 Flutter 工具层面直接报 “requires a selected Development Team”。
      # 因此这里构建 **模拟器产物**（唯一完全免签名的路径），用于在 CI 上验证
      # iOS 目标能否编译通过。若要出真机 / 上架包，请配置
      # secrets（证书 + Provisioning Profile）后再改用 ipa 构建。
      - name: Build iOS (simulator, no codesign)
        run: flutter build ios --simulator

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: warn
