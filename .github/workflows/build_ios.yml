name: build-ios

# 产出未签名的 iOS .app / IPA（--no-codesign）。
# 若需要上架，请在本仓库配置 secrets 后改用 exportOptions.plist + 证书导入步骤。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build iOS (no codesign)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold native projects
        run: |
          set -e
          flutter create --project-name moread --org com.moread \
            --platforms=ios /tmp/scaffold
          cp -r /tmp/scaffold/ios .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      # 说明：CI 没有开发团队证书，`flutter build ipa` 即使加 --no-codesign
      # 也会在 archive 阶段要求 DEVELOPMENT_TEAM。因此这里产出未签名的 Runner.app
      # （可用于越狱设备/后续本地签名），需要上架时再配置证书与 exportOptions。
      - name: Build iOS app bundle (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: warn
