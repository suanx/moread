name: release

# 打 tag（v*）时：三端构建 → 自动创建 GitHub Release 并附上安装包。
# 产物清单：
#   - Android：APK（split-per-abi，三份）
#   - iOS：模拟器 Runner.app 压缩包（CI 无证书，无法出真机 IPA，见 build_ios.yml 注释）
#   - Web：build/web 压缩包
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Android APK
  # ===========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Scaffold native projects
        run: |
          set -e
          if [ ! -d android ]; then
            flutter create --project-name moread --org com.moread \
              --platforms=android /tmp/scaffold
            cp -r /tmp/scaffold/android .
          else
            echo "android/ already committed, skip scaffolding"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Ensure Android SDK platform 36
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          for SM in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$SM" ]; then
              yes 2>/dev/null | "$SM" --install "platforms;android-36" || true
              break
            fi
          done

      # 与 build_android.yml 相同的兼容补丁，原因详见其注释
      - name: Patch outdated Android plugin modules
        run: |
          set -e
          CACHE="$HOME/.pub-cache/hosted/pub.dev"
          find "$CACHE" -path '*/android/build.gradle' \
            -print0 | xargs -0 -r sed -i -E \
            -e "s|proguard-android\.txt|proguard-android-optimize.txt|g" \
            -e "s|compileSdkVersion[[:space:]]*=?[[:space:]]*[0-9]+|compileSdkVersion 36|g" \
            -e "s|compileSdk[[:space:]]*=[^[:space:]]+|compileSdk = 36|g" \
            -e "s|compileSdk[[:space:]]+[0-9]+|compileSdk 36|g" \
            -e "s|targetSdkVersion[[:space:]]*=?[[:space:]]*[0-9]+|targetSdkVersion 35|g"

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          DIR=build/app/outputs/flutter-apk
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "$DIR/app-$ABI-release.apk" ]; then
              mv "$DIR/app-$ABI-release.apk" "$DIR/Moread-$VER-$ABI.apk"
            fi
          done
          ls -la "$DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # ===========================================================================
  # iOS（模拟器构建，唯一免签名路径）
  # ===========================================================================
  build-ios:
    name: Build iOS (simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Scaffold native projects
        run: |
          set -e
          if [ ! -d ios ]; then
            flutter create --project-name moread --org com.moread \
              --platforms=ios /tmp/scaffold
            cp -r /tmp/scaffold/ios .
          else
            echo "ios/ already committed, skip scaffolding"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (simulator, no codesign)
        run: flutter build ios --simulator

      - name: Zip Runner.app
        run: |
          set -e
          cd build/ios/iphonesimulator
          zip -r -q "Moread-${GITHUB_REF_NAME#v}-ios-simulator.zip" Runner.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphonesimulator/*.zip
          if-no-files-found: error

  # ===========================================================================
  # Web
  # ===========================================================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Scaffold web project
        run: |
          set -e
          if [ ! -d web ]; then
            flutter create --project-name moread --org com.moread \
              --platforms=web /tmp/scaffold
            cp -r /tmp/scaffold/web .
          else
            echo "web/ already committed, skip scaffolding"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        run: flutter build web --release --base-href /moread/

      - name: Zip web build
        run: |
          set -e
          cd build/web
          zip -r -q "../../Moread-${GITHUB_REF_NAME#v}-web.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: build/*.zip
          if-no-files-found: error

  # ===========================================================================
  # 发布
  # ===========================================================================
  publish:
    name: Create GitHub Release
    needs: [build-android, build-ios, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List files
        run: find dist -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 墨读 Moread ${{ github.ref_name }}
          files: dist/**/*
          generate_release_notes: true
