name: build-web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold web project
        run: |
          set -e
          flutter create --project-name moread --org com.moread \
            --platforms=web /tmp/scaffold
          cp -r /tmp/scaffold/web .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        run: flutter build web --release --base-href /moread/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web
          if-no-files-found: warn

      # 说明：GitHub Pages 部署需要在仓库设置里先开启 Pages（Source = GitHub Actions）。
      # 未开启时 deploy-pages 会失败，因此默认只在打了 tag 时才部署；
      # 平时只上传 build/web 作为构建产物。
      - name: Upload Pages artifact (tagged releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
