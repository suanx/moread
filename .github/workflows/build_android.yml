name: build-android

# 产出 Android APK（release）。
# 说明：本仓库只维护 lib/ + 配置，原生工程在 CI 中由 flutter create 脚手架生成，
# 因此不会覆盖已有的 lib/main.dart。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_aab:
        description: '同时构建 AAB（上架用）'
        type: boolean
        default: false

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold native projects
        run: |
          set -e
          flutter create --project-name moread --org com.moread \
            --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android .
          # 补充 Release 签名占位（默认使用 debug key，保证可安装）
          if [ ! -f android/key.properties ]; then
            echo "android/key.properties not provided; using default signing" >&2
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Ensure Android SDK platform 36
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          for SM in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$SM" ]; then
              yes 2>/dev/null | "$SM" --install "platforms;android-36" || true
              break
            fi
          done

      - name: Patch outdated Android plugin modules
        # 两个已知的老插件兼容问题，升级依赖后可移除本步骤：
        # 1) flutter_inappwebview_android 1.1.3 调用 getDefaultProguardFile('proguard-android.txt')，
        #    新版 AGP 已移除该默认文件（因其含 -dontoptimize），Gradle 求值会直接失败；
        # 2) 部分插件（如联邦化的 file_picker_android）仍按 compileSdk 34 编译，
        #    而 flutter_plugin_android_lifecycle 要求依赖方 compileSdk >= 36，
        #    AAR 元数据校验会失败。
        #    统一把 pub cache 里所有插件模块的 compileSdk 提到 36（高版本向后兼容）。
        run: |
          set -e
          CACHE="$HOME/.pub-cache/hosted/pub.dev"
          find "$CACHE" -path '*/android/build.gradle' \
            -print0 | xargs -0 -r sed -i -E \
            -e "s|proguard-android\.txt|proguard-android-optimize.txt|g" \
            -e "s|compileSdkVersion[[:space:]]*=?[[:space:]]*[0-9]+|compileSdkVersion 36|g" \
            -e "s|compileSdk[[:space:]]*=[^[:space:]]+|compileSdk = 36|g" \
            -e "s|compileSdk[[:space:]]+[0-9]+|compileSdk 36|g" \
            -e "s|targetSdkVersion[[:space:]]*=?[[:space:]]*[0-9]+|targetSdkVersion 35|g"
          echo "--- verify ---"
          find "$CACHE" -path '*/android/build.gradle' -print0 \
            | xargs -0 -r grep -H "compileSdk" | head -20 || true

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build AAB
        if: ${{ github.event.inputs.build_aab == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build appbundle --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
