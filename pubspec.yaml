name: moread
description: 墨读 Moread —— 一套源码覆盖 iOS / Android / Web / 桌面的电子书阅读器
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---------- 状态管理 / 路由 ----------
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # ---------- 数据持久化 ----------
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  shared_preferences: ^2.2.3

  # ---------- 基础工具 ----------
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.4.0
  collection: ^1.18.0
  crypto: ^3.0.5
  mime: ^1.0.5

  # ---------- 网络 ----------
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.0
  cached_network_image: ^3.3.1

  # ---------- 书籍格式解析 ----------
  archive: ^3.6.1      # EPUB(zip) 解包
  xml: ^6.5.0          # OPF / NCX / nav 解析
  html: ^0.15.4        # XHTML 正文抽取与清洗
  pdfrx: ^1.0.0        # PDF 渲染与页面信息

  # ---------- 阅读器渲染 ----------
  flutter_inappwebview: ^6.1.0

  # ---------- 音频（Edge-TTS 朗读） ----------
  just_audio: ^0.9.38
  audio_session: ^0.1.19
  just_audio_background: ^0.0.1-beta.11
  audio_service: ^0.18.14

  # ---------- 权限 / 设备 ----------
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  file_picker: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
